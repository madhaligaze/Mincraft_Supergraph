<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Supergraph · материалы</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #14171c;
        color: #e8ecf2;
        font: 12px ui-sans-serif, "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0 0 14px; letter-spacing: .08em; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .cell { width: 128px; }
      .cell canvas {
        width: 128px; height: 128px;
        image-rendering: pixelated;
        border-radius: 4px;
        display: block;
        background: repeating-conic-gradient(#2a2f36 0 25%, #222ominance 0 50%) 0 0 / 16px 16px;
      }
      .cell .pair { display: flex; gap: 2px; }
      .cell .pair canvas { width: 63px; height: 63px; }
      .cell span { display: block; margin-top: 4px; color: #97a2b2; font-size: 10px; }
    </style>
  </head>
  <body>
    <h1>МАТЕРИАЛЫ · albedo (крупно) + normal/rough (мелко)</h1>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/debug/materials.ts"></script>
  </body>
</html>
