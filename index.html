<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Supergraph</title>
    <!-- Inline so there is no extra request, and no 404 when there is no file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f14'/%3E%3Cpath d='M6 19l10-6 10 6-10 6z' fill='%237fd4a8'/%3E%3Cpath d='M6 19v-6l10-6v6z' fill='%234f9c78'/%3E%3Cpath d='M26 19v-6l-10-6v6z' fill='%23356b53'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="crosshair" hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 9v5M16 18v5M9 16h5M18 16h5" />
        <circle cx="16" cy="16" r="1.1" />
      </svg>
    </div>

    <div id="hud" hidden>
      <!--
        Breath. Hidden entirely on dry land: a meter that is always full and
        always on screen is furniture, and this one only means anything while
        the player is under water.
      -->
      <div id="breath" hidden></div>
      <div id="hotbar"></div>
    </div>

    <pre id="stats" hidden></pre>

    <div id="overlay">
      <div class="panel">
        <div id="loader"><div id="loader-bar"></div></div>
        <!--
          Carries the progress text, but stays hidden: the bar already says how
          far along the load is. It is revealed only when startup fails, which
          is the one case where there is something to read.
        -->
        <p id="loader-label" hidden></p>
        <button id="play" type="button" disabled>Играть</button>
      </div>
    </div>

    <div id="settings" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
